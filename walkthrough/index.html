<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Take the Tour | How WONDA Works for Dog Owners &amp; Field Owners</title>
<link rel="canonical" href="https://wonda.dog/walkthrough/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="An interactive walkthrough of WONDA — see exactly how dog owners find, check and book secure dog fields, and how field owners list a field and get paid.">
<meta name="theme-color" content="#1B4332">
<meta property="og:type" content="website">
<meta property="og:site_name" content="WONDA">
<meta property="og:locale" content="en_GB">
<meta property="og:title" content="Take the WONDA Tour">
<meta property="og:description" content="Click through the real app — find, check and book a secure dog field, or see how listing your own field works.">
<meta property="og:url" content="https://wonda.dog/walkthrough/">
<meta property="og:image" content="https://wonda.dog/assets/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F5F0;
    --surface:#FFFFFF;
    --ink:#2B2B2B;
    --ink-muted:#5B6B60;
    --accent:#2E7D4F;
    --accent-deep:#1B4332;
    --gold:#E9C46A;
    --border:rgba(27,67,50,0.14);
    --border-soft:rgba(27,67,50,0.08);
    --shadow: 0 1px 2px rgba(27,67,50,0.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#122019;
      --surface:#17251D;
      --ink:#F2EEE3;
      --ink-muted:#9AA79C;
      --accent:#7FCC9E;
      --accent-deep:#7FCC9E;
      --gold:#E9C46A;
      --border:rgba(255,255,255,0.10);
      --border-soft:rgba(255,255,255,0.06);
      --shadow: 0 1px 2px rgba(0,0,0,0.3);
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Source Serif 4', Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  h1,h2,h3,.eyebrow,.btn,nav,footer,.seg,.stepnav,.step-kicker{font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;}
  img{max-width:100%;display:block;}
  a{color:inherit;}
  .wrap{max-width:1040px;margin-inline:auto;padding-inline:24px;}

  nav.top{display:flex;align-items:center;justify-content:space-between;padding-block:22px;}
  .brand{text-decoration:none;display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:0.02em;font-size:16px;}
  .brand img{width:30px;height:30px;border-radius:8px;}
  nav.top a.navlink{font-size:13.5px;font-weight:600;color:var(--ink-muted);text-decoration:none;}
  nav.top a.navlink:hover{color:var(--ink);}
  .navlinks{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:flex-end;}

  header.tourhead{text-align:center;padding-block:28px 10px;}
  .eyebrow{
    display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;
    color:var(--accent);margin-bottom:10px;
  }
  h1{
    font-weight:800;font-size:clamp(28px,5vw,44px);line-height:1.08;letter-spacing:-0.02em;
    margin:0 0 12px;text-wrap:balance;
  }
  .tourhead p{font-size:clamp(15px,2.2vw,17px);line-height:1.6;color:var(--ink-muted);max-width:52ch;margin:0 auto;}

  /* Persona toggle */
  .seg{
    display:flex;gap:6px;justify-content:center;flex-wrap:wrap;
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:6px;width:max-content;max-width:100%;margin:26px auto 0;box-shadow:var(--shadow);
  }
  .seg button{
    appearance:none;border:0;cursor:pointer;
    font-family:inherit;font-size:14px;font-weight:700;
    padding:12px 22px;border-radius:11px;
    background:transparent;color:var(--ink-muted);
    transition:background .25s ease,color .25s ease;
  }
  .seg button[aria-pressed="true"]{background:var(--accent-deep);color:#F7F5F0;}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:var(--accent);color:#0F1A14;}
  }

  /* Tour layout */
  .tour{padding-block:40px 30px;}
  .stage{
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);
    gap:clamp(28px,5vw,64px);align-items:center;
  }
  @media (max-width:820px){
    .stage{grid-template-columns:1fr;gap:26px;}
    .stage-copy{order:2;text-align:center;}
    .stage-phone{order:1;}
  }
  .step-kicker{
    font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--accent);margin:0 0 10px;
  }
  .stage-copy h2{
    font-size:clamp(24px,3.6vw,34px);font-weight:800;letter-spacing:-0.018em;line-height:1.1;
    margin:0 0 14px;text-wrap:balance;
  }
  .stage-copy > p{font-size:16px;line-height:1.65;color:var(--ink-muted);margin:0 0 18px;max-width:46ch;}
  @media (max-width:820px){ .stage-copy > p{margin-inline:auto;} }
  .points{list-style:none;margin:0;padding:0;display:grid;gap:9px;max-width:46ch;}
  @media (max-width:820px){ .points{margin-inline:auto;text-align:left;} }
  .points li{
    position:relative;padding-left:26px;
    font-size:14.5px;line-height:1.55;color:var(--ink);
  }
  .points li::before{
    content:"✓";position:absolute;left:0;top:0;
    font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:13px;color:var(--accent);
  }

  /* Phone */
  .stage-phone{display:flex;justify-content:center;}
  .phone-frame{
    position:relative;width:min(300px,78vw);
    border-radius:34px;padding:9px;
    background:linear-gradient(165deg,#ACAD61,var(--accent) 48%,#1B4332);
    box-shadow:0 26px 48px -22px rgba(27,67,50,0.5);
  }
  .phone-frame .screen{position:relative;border-radius:26px;overflow:hidden;background:#122019;aspect-ratio:640/1308;}
  .phone-frame video,.phone-frame .statcard{
    position:absolute;inset:0;width:100%;height:100%;
    opacity:0;transition:opacity .35s ease;pointer-events:none;
  }
  .phone-frame video{object-fit:cover;display:block;}
  .phone-frame video.active,.phone-frame .statcard.active{opacity:1;pointer-events:auto;}

  /* Stat card step (field owners: get paid) */
  .statcard{
    background:
      radial-gradient(circle at 85% 12%, rgba(233,196,106,0.25), transparent 55%),
      linear-gradient(170deg,#24513C,#1B4332 60%,#132E24);
    display:flex;flex-direction:column;justify-content:center;gap:18px;
    padding:28px 24px;color:#F7F5F0;font-family:'Plus Jakarta Sans',sans-serif;
  }
  .statcard .big{font-size:44px;font-weight:800;color:var(--gold);line-height:1;}
  .statcard .lbl{font-size:13px;font-weight:600;color:rgba(247,245,240,0.8);margin-top:4px;line-height:1.4;}
  .statcard hr{border:0;border-top:1px solid rgba(247,245,240,0.16);margin:2px 0;}

  /* Step nav */
  .stepnav{margin-top:34px;display:grid;gap:16px;justify-items:center;}
  .dots{display:flex;gap:10px;align-items:center;}
  .dots button{
    appearance:none;border:0;cursor:pointer;padding:0;
    width:34px;height:5px;border-radius:99px;
    background:var(--border);transition:background .25s ease;
  }
  .dots button[aria-current="step"]{background:var(--accent);}
  .navrow{display:flex;gap:10px;align-items:center;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    font-weight:700;font-size:14.5px;padding:13px 22px;border-radius:14px;
    text-decoration:none;border:1px solid transparent;cursor:pointer;font-family:inherit;
  }
  .btn-primary{background:var(--accent-deep);color:#F7F5F0;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn-primary{background:var(--accent);color:#0F1A14;} }
  .btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--border);}
  .btn-gold{background:var(--gold);color:#3A2E05;}
  .btn[disabled]{opacity:.4;cursor:default;}
  .counter{font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:600;color:var(--ink-muted);}

  /* Finale */
  .finale{display:none;text-align:center;padding-block:14px 10px;}
  .finale.active{display:block;}
  .finale h2{font-size:clamp(24px,3.6vw,34px);font-weight:800;margin:0 0 12px;letter-spacing:-0.018em;}
  .finale p{font-size:16px;line-height:1.6;color:var(--ink-muted);max-width:52ch;margin:0 auto 24px;}
  .cta-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

  footer{padding-block:36px 48px;border-top:1px solid var(--border-soft);margin-top:46px;}
  .foot-row{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;
    font-size:13px;color:var(--ink-muted);font-family:'Plus Jakarta Sans',sans-serif;
  }
  .foot-links{display:flex;gap:18px;flex-wrap:wrap;}
  .foot-links a{text-decoration:none;color:var(--ink-muted);}
  .foot-links a:hover{color:var(--ink);}
  a:focus-visible,.btn:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}

  .fade-swap{transition:opacity .3s ease, transform .3s ease;}
  .fade-swap.swapping{opacity:0;transform:translateY(8px);}
  @media (prefers-reduced-motion: reduce){
    .fade-swap,.phone-frame video,.phone-frame .statcard{transition:none;}
  }
</style>
</head>
<body>

<div class="wrap">
  <nav class="top">
    <a class="brand" href="/"><img src="/assets/logo-64.png" width="30" height="30" alt=""> WONDA</a>
    <div class="navlinks">
      <a class="navlink" href="/secure-dog-fields/">Dog fields</a>
      <a class="navlink" href="/list-your-field/">For field owners</a>
      <a class="navlink" href="/faq/">FAQ</a>
      <a class="navlink" href="/contact.html">Contact</a>
    </div>
  </nav>
</div>

<header class="tourhead">
  <div class="wrap">
    <span class="eyebrow">Interactive tour</span>
    <h1>See exactly how WONDA works</h1>
    <p>Real screens from the app, step by step. Pick your side of the gate:</p>
    <div class="seg" role="group" aria-label="Choose a walkthrough">
      <button type="button" id="segOwner" aria-pressed="true">&#128021; I'm a dog owner</button>
      <button type="button" id="segHost" aria-pressed="false">&#127806; I own a field</button>
    </div>
  </div>
</header>

<main class="tour">
  <div class="wrap">
    <div class="stage">
      <div class="stage-copy fade-swap" id="copy">
        <p class="step-kicker" id="kicker"></p>
        <h2 id="stepTitle"></h2>
        <p id="stepBody"></p>
        <ul class="points" id="stepPoints"></ul>
      </div>
      <div class="stage-phone">
        <div class="phone-frame" id="phoneFrame">
          <div class="screen" id="screen"></div>
        </div>
      </div>
    </div>

    <div class="finale" id="finale">
      <h2 id="finaleTitle"></h2>
      <p id="finaleBody"></p>
      <div class="cta-row" id="finaleCtas"></div>
    </div>

    <div class="stepnav">
      <div class="dots" id="dots" role="tablist" aria-label="Tour steps"></div>
      <div class="navrow">
        <button class="btn btn-ghost" id="prevBtn" type="button">&larr; Back</button>
        <span class="counter" id="counter"></span>
        <button class="btn btn-primary" id="nextBtn" type="button">Next &rarr;</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="foot-row">
      <span>&copy; 2026 WONDA APP LTD · Company No. 17478579</span>
      <div class="foot-links">
        <a href="/">Home</a>
        <a href="/list-your-field/">List your field</a>
        <a href="/faq/">FAQ</a>
        <a href="https://www.instagram.com/wonda.app/" target="_blank" rel="me noopener">Instagram</a>
        <a href="https://www.facebook.com/p/WONDA-Dog-Field-Booking-61595348762014/" target="_blank" rel="me noopener">Facebook</a>
        <a href="/privacy.html">Privacy Policy</a>
        <a href="/terms.html">Terms of Service</a>
      </div>
    </div>
  </div>
</footer>

<script>
(function(){
  var A = '/assets/app/';
  var TOURS = {
    owner: {
      steps: [
        { video:'browse', kicker:'Step 1 · Find', title:'Fields near you, up front',
          body:'Open WONDA and nearby fields appear straight away — how far they are, the price per hour, and a safety score on every card.',
          points:['Safety rated out of 5, before you tap','Price per hour on every card','Distance from where you are right now'] },
        { video:'find', kicker:'Step 2 · Explore', title:'Or roam the map',
          body:'Every field pinned across the UK. Heading somewhere for the weekend? Check the map before you go.',
          points:['Tap any pin for price and rating','"Near me" jumps to your area','Great for holidays with the dog'] },
        { video:'detail', kicker:'Step 3 · Check', title:'Every detail, listed',
          body:'Fencing type and height, gates, lighting, size, how many dogs at once — and reviews only from owners who actually booked and visited.',
          points:['Fence height and condition stated','Double-gated entry flagged','No anonymous or bought reviews'] },
        { video:'book', kicker:'Step 4 · Book', title:'Book it in seconds',
          body:'Pick a date, a start time and how long you want. Pay securely in the app — the total is shown before you commit, no surprises.',
          points:['Sessions start on the hour and half hour','See the full price breakdown first','The field is private — yours alone'] },
        { video:'saved', kicker:'Step 5 · Save', title:'Keep your favourites close',
          body:'One tap saves a field to your list, ready to rebook. And when you invite friends, you both earn fee-free bookings.',
          points:['Rebook a favourite in two taps','Share fields with friends','Referrals earn fee-free bookings'] }
      ],
      finale: {
        title:'Ready to let them run?',
        body:'The WONDA app is on Google Play now, with fields joining across Devon and Cornwall. On iPhone? Leave your email on the home page and we’ll tell you the moment the iOS app lands.',
        ctas:[
          {label:'Get it on Google Play', href:'https://play.google.com/store/apps/details?id=dog.wonda.app', cls:'btn-primary'},
          {label:'On iPhone? Use it in your browser', href:'https://wonda.expo.app', cls:'btn-ghost'}
        ]
      }
    },
    host: {
      steps: [
        { video:'host1', kicker:'Step 1 · List', title:'Tell us about your field',
          body:'Name, address, a description, your price and how many dogs it can safely hold. It takes about ten minutes, and listing costs nothing.',
          points:['£0 to list — no setup fee, ever','what3words pinpoints the gate','You set the price per hour'] },
        { video:'host2', kicker:'Step 2 · Hours', title:'You set the hours',
          body:'Open the days and times that suit you. Keep weekday mornings for yourself, close Sundays — the field is yours, the rules are yours.',
          points:['Per-day opening and closing times','Switch any day off entirely','Change your hours whenever you like'] },
        { video:'host3', kicker:'Step 3 · Safety', title:'Fencing, safety &amp; extras',
          body:'Record your fencing, gates, CCTV, parking and amenities once — it all appears on your listing. Then submit, and a real person reviews every field before it goes live.',
          points:['Clear safety info builds trust — and bookings','Photos of fencing and gates help approval','Reviewed by a human, not a bot'] },
        { video:null, kicker:'Step 4 · Earn', title:'Get paid automatically',
          body:'Dog owners book and pay in the app. After every visit, Stripe sends your share straight to your bank — no invoicing, no chasing, nothing to run.',
          points:['Founding Partners keep 95% of every booking','Paid out automatically via Stripe','Card fees covered for Founding Partners'] }
      ],
      finale: {
        title:'Founding Partner spots are open',
        body:'The first fields to join pay just 5% commission with no end date, plus a commission-free month for every field they refer — and it stays free to list. Every listing is personally reviewed.',
        ctas:[
          {label:'Apply to list your field', href:'https://wonda.expo.app/host/apply', cls:'btn-gold'},
          {label:'How listing works', href:'/list-your-field/', cls:'btn-ghost'}
        ]
      }
    }
  };

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var screen = document.getElementById('screen');
  var vids = {};
  ['browse','find','detail','book','saved','host1','host2','host3'].forEach(function(name){
    var v = document.createElement('video');
    v.src = A + name + '.mp4';
    v.poster = A + name + '.jpg';
    v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'none';
    v.setAttribute('muted',''); v.setAttribute('playsinline','');
    if (reduce) v.controls = true;
    screen.appendChild(v);
    vids[name] = v;
  });
  var statcard = document.createElement('div');
  statcard.className = 'statcard';
  statcard.innerHTML =
    '<div><div class="big">95%</div><div class="lbl">of every booking is yours as a Founding Partner</div></div><hr>' +
    '<div><div class="big">£0</div><div class="lbl">to list — card fees covered for Founding Partners</div></div><hr>' +
    '<div><div class="big" style="font-size:30px;">Stripe</div><div class="lbl">pays your bank automatically after every visit</div></div>';
  screen.appendChild(statcard);

  var persona = 'owner', idx = 0;
  var kicker = document.getElementById('kicker'),
      title = document.getElementById('stepTitle'),
      body = document.getElementById('stepBody'),
      points = document.getElementById('stepPoints'),
      dots = document.getElementById('dots'),
      counter = document.getElementById('counter'),
      prevBtn = document.getElementById('prevBtn'),
      nextBtn = document.getElementById('nextBtn'),
      copy = document.getElementById('copy'),
      finale = document.getElementById('finale'),
      stage = document.querySelector('.stage');

  function steps(){ return TOURS[persona].steps; }

  function buildDots(){
    dots.innerHTML = '';
    for (var i = 0; i <= steps().length; i++){
      (function(i){
        var b = document.createElement('button');
        b.type = 'button';
        b.setAttribute('aria-label', i < steps().length ? 'Step ' + (i+1) : 'Finish');
        b.addEventListener('click', function(){ go(i); });
        dots.appendChild(b);
      })(i);
    }
  }

  function render(){
    var list = steps(), onFinale = idx >= list.length;
    stage.style.display = onFinale ? 'none' : '';
    finale.classList.toggle('active', onFinale);
    Array.prototype.forEach.call(dots.children, function(d, i){
      if (i === idx) d.setAttribute('aria-current','step'); else d.removeAttribute('aria-current');
    });
    prevBtn.disabled = idx === 0;
    if (onFinale){
      var f = TOURS[persona].finale;
      document.getElementById('finaleTitle').textContent = f.title;
      document.getElementById('finaleBody').textContent = f.body;
      var ctas = document.getElementById('finaleCtas');
      ctas.innerHTML = '';
      f.ctas.forEach(function(c){
        var a = document.createElement('a');
        a.className = 'btn ' + c.cls; a.href = c.href; a.textContent = c.label;
        ctas.appendChild(a);
      });
      counter.textContent = '';
      nextBtn.textContent = persona === 'owner' ? 'See the field-owner side →' : 'See the dog-owner side →';
      Object.keys(vids).forEach(function(k){ vids[k].classList.remove('active'); vids[k].pause(); });
      statcard.classList.remove('active');
      return;
    }
    var s = list[idx];
    kicker.textContent = s.kicker;
    title.innerHTML = s.title;
    body.textContent = s.body;
    points.innerHTML = '';
    s.points.forEach(function(p){
      var li = document.createElement('li'); li.textContent = p; points.appendChild(li);
    });
    counter.textContent = (idx+1) + ' / ' + list.length;
    nextBtn.textContent = idx === list.length - 1 ? 'Finish →' : 'Next →';
    Object.keys(vids).forEach(function(k){
      var on = s.video === k;
      vids[k].classList.toggle('active', on);
      if (on && !reduce){ var p = vids[k].play(); if (p && p.catch) p.catch(function(){}); }
      else if (!on) vids[k].pause();
    });
    statcard.classList.toggle('active', s.video === null);
  }

  function go(i){
    var max = steps().length;
    idx = Math.max(0, Math.min(max, i));
    if (reduce){ render(); return; }
    copy.classList.add('swapping');
    setTimeout(function(){ render(); copy.classList.remove('swapping'); }, 160);
  }

  function setPersona(p){
    if (p !== persona){
      persona = p; idx = 0;
      buildDots();
    } else if (persona === p && idx !== 0){
      idx = 0;
    }
    document.getElementById('segOwner').setAttribute('aria-pressed', String(p === 'owner'));
    document.getElementById('segHost').setAttribute('aria-pressed', String(p === 'host'));
    go(idx);
  }

  prevBtn.addEventListener('click', function(){ go(idx - 1); });
  nextBtn.addEventListener('click', function(){
    if (idx >= steps().length){ setPersona(persona === 'owner' ? 'host' : 'owner'); }
    else go(idx + 1);
  });
  document.getElementById('segOwner').addEventListener('click', function(){ setPersona('owner'); });
  document.getElementById('segHost').addEventListener('click', function(){ setPersona('host'); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight' && idx < steps().length) go(idx + 1);
    if (e.key === 'ArrowLeft') go(idx - 1);
  });
  var touchX = null;
  document.getElementById('phoneFrame').addEventListener('touchstart', function(e){ touchX = e.changedTouches[0].clientX; }, {passive:true});
  document.getElementById('phoneFrame').addEventListener('touchend', function(e){
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX; touchX = null;
    if (Math.abs(dx) < 40) return;
    if (dx < 0 && idx < steps().length) go(idx + 1); else if (dx > 0) go(idx - 1);
  }, {passive:true});

  var hash = (location.hash || '').replace('#','');
  if (hash === 'host' || hash === 'field-owners') persona = 'host';
  buildDots();
  setPersona(persona);
})();
</script>

</body>
</html>
